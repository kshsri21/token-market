name: Linting
on:
  push:
    branches:
      - master

jobs:
  forge-format:
    runs-on: ubuntu-latest

    steps:
      - name: Monitor network egress
        uses: bullfrogsec/bullfrog@6ad91f116342abf94e4d02c6d05260cacf717bd0

      - name: Checkout Action
        uses: actions/checkout@v7

      - name: Install Foundry Toolchain
        uses: foundry-rs/foundry-toolchain@v1

      - name: Format
        run: forge fmt --check
